<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Zoom is never blocked: blocking it fails anyone who needs it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Lady_GYM — workouts made for women, planned around your classes, with a picture for every move.">

  <!-- iPhone: run full screen from the Home Screen, with its own name and icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lady_GYM">
  <meta name="format-detection" content="telephone=no">

  <title>Lady_GYM</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <!-- iOS ignores SVG for the Home Screen, so this must be a PNG. -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

  <!-- Launch screens, so opening from the Home Screen shows Lady_GYM instead of a white flash. -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="./icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="./icons/splash-750x1334.png">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/screens.css">
</head>
<body>
  <div id="boot" class="boot">
    <div>
      <img class="boot-mark" src="./icons/icon-180.png" alt="" width="96" height="96">
      <h1>Lady_GYM</h1>
      <p>Getting your workout ready…</p>
    </div>
  </div>

  <div id="onboarding" class="onboarding" hidden></div>

  <div id="app">
    <div id="stacks" class="stacks"></div>
    <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
  </div>
  <div id="modal-host"></div>

  <noscript>
    <div style="padding:24px;font:17px/1.5 -apple-system,system-ui,sans-serif">
      <h1>Lady_GYM needs JavaScript</h1>
      <p>Everything runs on your phone. Turn JavaScript on in Settings → Safari → Advanced, then reload.</p>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
